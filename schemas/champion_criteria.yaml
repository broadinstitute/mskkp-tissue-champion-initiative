# =============================================================================
# MSKKP Tissue Champion — champion criteria (QC thresholds, NOT LinkML)
# =============================================================================
# These are aggregate/statistical checks over rows of obs (min/max/n_unique/
# n_rows, gated by `when` conditions). LinkML validates individual records
# against slot constraints (required, range, pattern, cardinality) — it has no
# construct for "the minimum of this column across all rows must exceed X" or
# "there must be at least 10 distinct values in this column". So this file is
# a plain machine-readable checklist, meant to be consumed by a small
# standalone validator (e.g. pandas/anndata script) run against obs, not by
# linkml-validate. It is the extra bar a dataset must clear to serve as a
# tissue's REFERENCE ("champion") dataset, on top of passing schema validation
# against mskkp_rnaseq_schema.yaml.
#
# Each rule: field + operator + threshold, optionally gated by a `when`
# condition. `status: required` rules must all pass; `recommended` rules are
# reported but do not block champion status.
# =============================================================================

champion_criteria:

  - id: min_counts
    description: Every cell has more than 300 total counts.
    field: obs.nCount_RNA
    aggregate: min
    operator: ">"
    threshold: 300
    status: required

  - id: max_mito_snRNA
    description: Mitochondrial fraction under 5% for single-nucleus assays.
    when: obs.assay == "snRNA-seq"
    field: obs.percent_mt
    aggregate: max
    operator: "<"
    threshold: 5
    units: percent
    status: required

  - id: max_mito_scRNA
    description: Mitochondrial fraction under 20% for single-cell assays.
    when: obs.assay == "scRNA-seq"
    field: obs.percent_mt
    aggregate: max
    operator: "<"
    threshold: 20
    units: percent
    status: required

  - id: annotation_depth
    description: >
      Both author-provided label layers are present — a broad
      author_celltype AND a specific author_cell_subtype (not just one of
      them).
    field: obs.annotations.levels
    operator: ">="
    threshold: 2
    status: required

  - id: celltype_well_defined
    description: >
      Each author_cell_subtype nests under exactly one author_celltype and
      is represented by a reasonable number of cells (proxy for
      well-resolved cell types).
    checks:
      - every author_cell_subtype maps to exactly one author_celltype
      - min cells per author_cell_subtype >= 20  # tunable per tissue; see TissueProfile.min_cells_per_subtype
    status: required

  - id: donor_count
    description: At least 10 donors.
    field: obs.donor_id
    aggregate: n_unique
    operator: ">="
    threshold: 10
    status: recommended

  - id: control_and_disease
    description: Includes Control and, where available, disease donors.
    field: obs.disease_status
    check: contains "Control" and >= 2 distinct values
    status: recommended            # disease samples "if available"

  - id: cell_count
    description: At least 50,000 cells.
    field: obs
    aggregate: n_rows
    operator: ">="
    threshold: 50000
    status: recommended
