# =============================================================================
# MSKKP Tissue Champion — RNA-seq gold-standard schema
# =============================================================================
# Defines the tissue-agnostic structure every conforming RNA-seq dataset must
# follow: object format and matrices, per-cell obs metadata (annotations,
# donor info, QC metrics), per-gene var metadata, and uns provenance. These
# classes are identical across all 7 musculoskeletal tissues.
#
# Tissue-specific content — each tissue's cell-type ontology, disease
# conditions, default assay, etc. — is NOT defined here. It's instance data
# that conforms to the TissueProfile / TissueProfileCollection classes below,
# and lives in tissue_profiles.yaml, one block per tissue. Champion contact
# info (name/affiliation/email) is kept out of this schema and tracked
# separately — see schemas/champions_roster.yaml.
#
# The champion_criteria (aggregate QC thresholds like "min(nCount_RNA) > 500"
# or "n_unique(donor_id) >= 10") live in champion_criteria.yaml and are
# checked by validate_champion_criteria.py — they're statistics over rows of
# obs, which this schema's per-record slot constraints can't express.
# =============================================================================

id: https://github.com/broadinstitute/mskkp-tissue-champion-initiative/schemas/mskkp_rnaseq_schema
name: mskkp-rnaseq-gold-standard
title: MSKKP Tissue Champion RNA-seq gold-standard schema
description: >-
  Standard for single-cell / single-nucleus RNA-seq reference datasets across
  musculoskeletal tissue types. Defines object layout, required metadata, and
  the quality thresholds that qualify a dataset as a tissue "champion".
version: 0.1.0-draft
status: draft
comments:
  - "initiative_lead: Jeremy Arbesfeld (Knowledge Portal Network)"
  - "schema_author: Luca Tucciarone (Gaulton Lab) - original template"

license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  linkml: https://w3id.org/linkml/
  mskkp: https://github.com/broadinstitute/mskkp-tissue-champion-initiative/
  CL: http://purl.obolibrary.org/obo/CL_
  HGNC: https://identifiers.org/hgnc/
  ENSEMBL: https://identifiers.org/ensembl/

default_prefix: mskkp
default_range: string

imports:
  - linkml:types

# -----------------------------------------------------------------------------
# Enums
# -----------------------------------------------------------------------------
enums:

  FileFormatEnum:
    description: Serialized object formats a conforming dataset may be delivered as.
    permissible_values:
      h5ad:
        description: AnnData (Python) — preferred.
      rds:
        description: Seurat (R) — accepted equivalent.

  AssayEnum:
    description: Single-cell vs single-nucleus RNA-seq. Drives the percent.mt threshold.
    permissible_values:
      scRNA-seq:
        description: Single-cell RNA-seq.
      snRNA-seq:
        description: Single-nucleus RNA-seq.

  SexEnum:
    permissible_values:
      M:
      F:
      unknown:

  GeneIdSystemEnum:
    description: Identifier system used as the gene key in var.gene_id.
    permissible_values:
      hgnc:
      ensembl:

  XHoldsEnum:
    description: What adata.X contains for this dataset.
    permissible_values:
      normalized:
      raw:

  CertificationLevelEnum:
    description: >-
      How this dataset's content (annotations, QC metrics, cell-type calls)
      was produced and reviewed. Not mutually exclusive — a dataset can carry
      more than one tag, e.g. ai_generated + human_reviewed if a human
      confirmed AI-drafted annotations.
    permissible_values:
      ai_generated:
        description: Annotations/metadata were produced or drafted by an AI system, not yet reviewed by a human.
      human_reviewed:
        description: A human has reviewed and confirms the annotations/metadata.
      community_validated:
        description: >-
          Reviewed and endorsed by the tissue's champion community — meets
          champion_criteria and the tissue champion has signed off.

  TissueProfileStatusEnum:
    permissible_values:
      draft-starter:
        description: Pre-seeded starter content; not yet reviewed by the champion.
      confirmed:
        description: Champion has reviewed the block's content and signed off.
      example:
        description: Fully worked reference block (skeletal_muscle) matching the toy dataset.

# -----------------------------------------------------------------------------
# Classes — 1. OBJECT (file format and expression matrices)
# -----------------------------------------------------------------------------
classes:

  ObjectSpec:
    description: The serialized object a conforming dataset is delivered as.
    attributes:
      format:
        range: FileFormatEnum
        required: true
        description: Serialization format of the delivered object.
      raw_counts:
        range: boolean
        required: true
        description: >-
          Unnormalized integer UMI counts (dtype: integer). Exactly one
          location must hold these; if stored in adata.X instead of a layer,
          that must be declared in uns.schema.X_holds.
        comments:
          - 'location_h5ad: adata.layers["counts"]'
          - 'location_seurat: obj[["RNA"]]@counts'
      normalized:
        range: boolean
        required: true
        description: >-
          Log-normalized expression, Seurat "data" slot equivalent (dtype:
          float). Default method LogNormalize, scale factor 10000.
        comments:
          - 'location_h5ad: adata.X'
          - 'location_seurat: obj[["RNA"]]@data'

  # ---------------------------------------------------------------------------
  # 2. OBS — cell-level metadata (one row per cell)
  # ---------------------------------------------------------------------------
  CellObservation:
    description: >-
      One row of obs: metadata for a single cell. Every cell gets two required
      annotation levels, broad to specific: celltype (Level 1, e.g.
      "Myonucleus") and cell_subtype (Level 2, e.g. "Myonucleus-Type-I"), where
      every cell_subtype value must nest under exactly one celltype value.
      Deeper levels are allowed but not required or modeled here.
    attributes:
      celltype:
        required: true
        description: Broad cell-type label (Level 1), e.g. "Myonucleus", "FAP".
        comments:
          - "ontology_ref: CL (Cell Ontology), where mappable"
      cell_subtype:
        required: true
        description: >-
          Specific subtype within celltype (Level 2), e.g.
          "Myonucleus-Type-I" / "-Type-II". Must nest under exactly one celltype value.
        comments:
          - "ontology_ref: CL (Cell Ontology), where mappable"
          - "nests_under: celltype"
      donor_id:
        required: true
        description: Stable identifier for the biological donor/sample of origin.
      disease_status:
        required: false
        description: >-
          Clinical group; use "Control" for unaffected donors. Baseline
          recommended values are Control/Disease — each tissue_profile refines
          this with its own disease_conditions list.
      age:
        range: float
        unit:
          ucum_code: a
        description: Donor age in years.
      sex:
        range: SexEnum
      assay:
        range: AssayEnum
        required: true
        description: Drives which percent.mt champion threshold applies.
      anatomical_site:
        description: Sampling site within the tissue (tissue-specific vocabulary).
      nCount_RNA:
        range: integer
        required: true
        minimum_value: 0
        description: Total UMIs per cell.
      nFeature_RNA:
        range: integer
        required: true
        minimum_value: 0
        description: Number of genes detected per cell.
      percent_mt:
        range: float
        required: false
        minimum_value: 0
        maximum_value: 100
        unit:
          symbol: "%"
        description: >-
          Percentage of counts from mitochondrial genes. Computable from
          var.mt if absent.

  # ---------------------------------------------------------------------------
  # 3. VAR — gene-level metadata (one row per gene)
  # ---------------------------------------------------------------------------
  GeneVariable:
    description: >-
      One row of var: metadata for a single gene, keyed by a stable
      identifier (gene_id), not by symbol.
    attributes:
      gene_id:
        identifier: true
        required: true
        description: >-
          Stable gene identifier used as the gene key — either an HGNC ID
          (e.g. "HGNC:7577") or an Ensembl gene ID (e.g. "ENSG00000092054").
          Which system is used is recorded in uns.schema.gene_id_system.
      gene_symbol:
        required: true
        description: >-
          Human-readable English symbol associated with the gene_id (e.g.
          "MYH7"). For readability only — gene_id is the canonical key.
      mt:
        range: boolean
        description: Flags mitochondrial genes (used to compute percent_mt).
      highly_variable:
        range: boolean
        description: Highly variable genes, if computed.

  # ---------------------------------------------------------------------------
  # 4. UNS — dataset-level provenance
  # ---------------------------------------------------------------------------
  DatasetProvenance:
    description: uns.schema — provenance block naming this standard + version and any deviations.
    attributes:
      standard:
        required: true
        equals_string: mskkp-rnaseq-gold-standard
      version:
        required: true
      tissue:
        required: true
        description: Tissue identifier, e.g. one of the tissue_profiles keys.
      gene_id_system:
        range: GeneIdSystemEnum
        multivalued: true
        description: Which identifier system(s) var.gene_id uses.
      X_holds:
        range: XHoldsEnum
        multivalued: true
        description: What adata.X contains.
      certification:
        range: CertificationLevelEnum
        multivalued: true
        description: >-
          Tags describing how this dataset's content was produced/reviewed
          (e.g. [ai_generated, human_reviewed]). Distinct from
          TissueProfile.status, which tracks review of the champion's
          cell-ontology block, not of any particular dataset.

  DonorMetadataTable:
    description: Optional donor-indexed summary table (one row per donor_id).
    attributes:
      donor_id:
        identifier: true
        required: true

  Dataset:
    description: A complete conforming RNA-seq dataset.
    tree_root: true
    attributes:
      object:
        range: ObjectSpec
        required: true
      obs:
        range: CellObservation
        multivalued: true
        inlined_as_list: true
        required: true
        description: One entry per cell.
      var:
        range: GeneVariable
        multivalued: true
        inlined_as_list: true
        required: true
        description: One entry per gene.
      schema_provenance:
        range: DatasetProvenance
        required: true
        description: uns.schema
      donor_metadata:
        range: DonorMetadataTable
        multivalued: true
        inlined_as_list: true
        required: false
        description: uns.donor_metadata, if supplied.

  # ---------------------------------------------------------------------------
  # 5. TISSUE_PROFILES — one fill-in block per tissue (instance data; see
  #    tissue_profiles.yaml for the actual 7 blocks validated against this).
  # ---------------------------------------------------------------------------
  CellSubtypeDefinition:
    description: One Level-2 subtype and its marker genes, within a CellTypeDefinition.
    attributes:
      name:
        required: true
      markers:
        multivalued: true
        description: >-
          Marker genes by gene_id (HGNC or Ensembl), matching the identifier
          system used as the gene key in var.gene_id.

  CellTypeDefinition:
    description: One Level-1 broad celltype and its Level-2 subtypes.
    attributes:
      name:
        required: true
      subtypes:
        range: CellSubtypeDefinition
        multivalued: true
        inlined_as_list: true

  TissueProfile:
    description: One fill-in block for a musculoskeletal tissue.
    attributes:
      tissue_id:
        identifier: true
        required: true
      default_assay:
        range: AssayEnum
        required: true
      status:
        range: TissueProfileStatusEnum
        required: true
      disease_conditions:
        multivalued: true
        description: Clinical groups in this tissue's cohort. Should include "Control".
      min_cells_per_subtype:
        range: integer
        description: Optional override of the champion_criteria clusters_well_defined default (20).
      cell_ontology:
        range: CellTypeDefinition
        multivalued: true
        inlined_as_list: true
      notes:

  TissueProfileCollection:
    description: All 7 musculoskeletal tissue blocks, keyed by tissue_id.
    attributes:
      tissue_profiles:
        range: TissueProfile
        multivalued: true
        inlined: true
        description: Keyed by tissue_id (cartilage, tendon, bone_marrow, bone, ivd, synovium, skeletal_muscle).
