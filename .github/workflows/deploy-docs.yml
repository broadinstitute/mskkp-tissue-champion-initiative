name: Deploy docs

# Publishes schema docs to GitHub Pages on every push that touches them.
# main -> https://<org>.github.io/<repo>/docs/...
# any other branch -> https://<org>.github.io/<repo>/preview/<branch>/docs/...
on:
  push:
    branches-ignore:
      - gh-pages
    paths:
      - 'schemas/**'
      - 'docs/**'
      - 'html/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: hashFiles('docs/build_docs.py') != ''
        with:
          python-version: '3.x'

      # Keeps the embedded schema data in the HTML in sync even if a
      # contributor forgot to run this locally before pushing.
      - name: Rebuild embedded schema data
        if: hashFiles('docs/build_docs.py') != ''
        run: |
          pip install pyyaml
          python3 docs/build_docs.py

      - name: Determine source and destination paths
        id: paths
        run: |
          if [ -d docs ]; then SRC=docs; else SRC=html; fi
          if [ "${{ github.ref_name }}" = "main" ]; then
            DEST="$SRC"
          else
            DEST="preview/${{ github.ref_name }}/$SRC"
          fi
          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./${{ steps.paths.outputs.src }}
          destination_dir: ${{ steps.paths.outputs.dest }}
          keep_files: true
